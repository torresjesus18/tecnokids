services:
  - type: web
    name: tecnokids
    runtime: node
    plan: starter
    buildCommand: npm ci
    preDeployCommand: npm run db:setup
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: tecnokids-db
          property: connectionString

databases:
  - name: tecnokids-db
    databaseName: tecnokids
    user: tecnokids
    plan: basic-256mb

# Blueprint de Render: configura el servidor Node y genera el secreto de sesión.
services:
  - type: web
    name: tecnokids
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
